{% extends "base.html" %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="sub-text">
            Start your AI Career Journey
        </p>


    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Create a Password"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <p class="sub-text">Use at least 6 characters</p>

        <button type="submit">
            Sign Up
        </button>

    </form>

    <p class="switch-auth">
        Already have an account?
        <a href="/login">Login</a>
    </p>
</div>


</div>
{% endblock %}
