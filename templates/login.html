{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back 👋</h2>
        <p class="sub-text">Sign in to continue your AI career journey</p>
        <form method="POST">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login →</button>
        </form>
        <div class="auth-links">
            <a href="#">Forgot password?</a>
        </div>
        <p class="switch-auth">Don't have an account? <a href="/signup">Create account</a></p>
    </div>
</div>
{% endblock %}
